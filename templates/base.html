<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveWell | 运动健康</title>
    <style>
      
        :root {
            --bg1: #071c2f;
            --bg2: #0f2e47;
            --panel: rgba(10, 24, 38, 0.72);
            --panel-light: rgba(255, 255, 255, 0.08);
            --primary: #70f0c5;
            --primary-2: #77c9ff;
            --accent: #ffc857;
            --text: #ecf7ff;
            --muted: #a6c3d9;
            --shadow: 0 24px 60px rgba(8, 18, 30, 0.45);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(112, 240, 197, 0.2), transparent 26%),
                radial-gradient(circle at bottom right, rgba(119, 201, 255, 0.18), transparent 30%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .shell {
            position: relative;
            width: min(1200px, 100%);
            min-height: 720px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            background: rgba(9, 20, 31, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .brand-panel {
            position: relative;
            padding: 48px 52px 36px;
            background:
                linear-gradient(180deg, rgba(18, 43, 58, 0.72), rgba(8, 16, 25, 0.64)),
                url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1200&q=80") center/cover no-repeat;
        }

        .brand-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(150deg, rgba(7, 28, 47, 0.55), rgba(7, 28, 47, 0.15));
        }

        .brand-inner,
        .login-box {
            position: relative;
            z-index: 1;
        }

        .brand-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 90px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #06243b;
            font-weight: 900;
            box-shadow: 0 10px 24px rgba(112, 240, 197, 0.38);
        }

        .tag {
            padding: 7px 12px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            background: rgba(255,255,255,0.04);
            font-size: 12px;
            color: var(--muted);
        }

        .hero-text {
            max-width: 500px;
        }

        .kicker {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(112, 240, 197, 0.12);
            border: 1px solid rgba(112, 240, 197, 0.25);
            color: var(--primary);
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 26px 0 18px;
            font-size: clamp(2.6rem, 4vw, 4.5rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        .hero-text p {
            margin: 0;
            max-width: 440px;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .stats {
            display: flex;
            gap: 22px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .stat-box {
            min-width: 120px;
            padding: 18px 20px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(255,255,255,0.04);
        }

        .num {
            display: block;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text);
        }

        .label {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .login-box {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 32px;
            background: rgba(5, 14, 22, 0.4);
        }

        .card {
            width: min(420px, 100%);
            padding: 36px 30px;
            border-radius: 28px;
            background: rgba(11, 25, 39, 0.82);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 40px rgba(2, 9, 16, 0.38);
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--muted);
            line-height: 1.6;
        }

        .socials {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
        }

        .or {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0 18px;
            color: var(--muted);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .or::before,
        .or::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.12);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .field input {
            width: 100%;
            padding: 15px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field input:focus {
            border-color: rgba(112, 240, 197, 0.6);
            box-shadow: 0 0 0 4px rgba(112, 240, 197, 0.12);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .check {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .check input {
            accent-color: var(--primary);
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        .submit-btn {
            padding: 16px 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #06263d;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 14px 30px rgba(112, 240, 197, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 28px rgba(112, 240, 197, 0.34);
        }

        .small-note {
            margin-top: 18px;
            font-size: 0.82rem;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 900px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .brand-panel {
                min-height: 420px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="shell">
            <section class="brand-panel">
                <div class="brand-inner">
                    <div class="brand-top">
                        <div class="logo">
                            <span class="logo-mark">M</span>
                            <span>MoveWell</span>
                        </div>
                        <span class="tag">健康生活 · 每天前进</span>
                    </div>

                    <div class="hero-text">
                        <span class="kicker">运动健康</span>
                        <h1>让每一步都更有力量。</h1>
                        <p>
                            记录步数、专注恢复、规划训练，和健康一起成长。
                            为更好的身体状态和更清晰的生活节奏，开启你的每日运动旅程。
                        </p>
                    </div>

                    <div class="stats">
                        <div class="stat-box">
                            <span class="num">24k+</span>
                            <span class="label">活跃用户</span>
                        </div>
                        <div class="stat-box">
                            <span class="num">92%</span>
                            <span class="label">坚持率</span>
                        </div>
                        <div class="stat-box">
                            <span class="num">7日</span>
                            <span class="label">健康计划</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="login-box">
                <div class="card">
                    <h2>欢迎回来</h2>
                    <p class="subtitle">登录你的运动健康账户，继续打磨更强的自己。</p>

                    <div class="socials">
                        <button class="social-btn" type="button">Google</button>
                        <button class="social-btn" type="button">Apple</button>
                    </div>

                    <div class="or">or</div>

                    {% if error %}
                    <div style="margin-bottom:18px; padding:12px 14px; border-radius:12px; background:rgba(255,111,97,0.12); border:1px solid rgba(255,111,97,0.28); color:#ffd8d3; font-size:0.85rem;">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="post" action="/login">
                        <div class="field">
                            <label for="email">邮箱</label>
                            <input id="email" name="email" type="text" value="admin" placeholder="请输入邮箱">
                        </div>

                        <div class="field">
                            <label for="password">密码</label>
                            <input id="password" name="password" type="password" value="123" placeholder="请输入密码">
                        </div>

                        <div class="row">
                            <label class="check">
                                <input type="checkbox">
                                <span>记住我</span>
                            </label>
                            <a href="#">忘记密码？</a>
                        </div>

                        <button class="submit-btn" type="submit">登录</button>
                    </form>

                    <div class="small-note">
                        测试账号：<strong>admin</strong> / <strong>123</strong>
                    </div>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
